[package]
name = "my_bevy_game"
version = "0.1.0"
edition = "2021"  # Changed from 2024 to 2021

# Enable some optimization in debug mode
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies (including bevy)
[profile.dev.package."*"]
opt-level = 3

[dependencies]
bevy = "0.13.0"  # Updated to latest stable version